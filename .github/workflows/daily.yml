name: Daily activity

on:
  schedule:
    # UTC：北京时间 00:15 主任务，04:35 / 20:35 补偿检查。
    - cron: '15 16 * * *'
    - cron: '35 20 * * *'
    - cron: '35 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-activity
  cancel-in-progress: false

jobs:
  record:
    if: github.repository == 'LittleSixNine/daily-contributions' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set repository-only author identity
        run: |
          git config user.name 'LittleSixNine'
          git config user.email '31497863+LittleSixNine@users.noreply.github.com'
      - name: Record today's activity
        run: python3 scripts/activity.py
      - name: Push batch to default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
